# Task 46 — Nginx reverse-proxy config skeleton, targeting the Oracle
# Cloud Free Tier Linux VM (per CLAUDE_MASTER_PROMPT.md section 6/7).
#
# This is a skeleton to copy into place and adjust (domain name, TLS
# certs) for the real VM, not something this repo runs directly.
# Typical install:
#
#   sudo cp deploy/nginx/natra.conf /etc/nginx/sites-available/natra
#   sudo ln -s /etc/nginx/sites-available/natra /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# --- Task 47: frontend/backend routing split ---
# Task 46 left this unresolved pending the frontend's actual routes.
# As of Task 47, `frontend/src/App.tsx` is still Task 3's placeholder
# (no React Router, no client-side routes of its own) — see
# PROJECT_ROADMAP.md's "UI/UX polish — deliberately not yet numbered"
# note, which is still open. So there is, in fact, no real frontend
# route to collide with a backend one yet. Rather than guess at an
# `/api` prefix for routes that don't exist in the frontend, this
# config takes the option that needs no backend code change: proxy
# the backend's existing path prefixes explicitly
# (`/health`, `/sellers/`, `/products`, `/payment-info`, `/receipts/`,
# `/admin/` — see `backend/app/main.py`'s route list) and serve the
# built frontend (`npm run build` → `frontend/dist/`, per
# `frontend/package.json`) for everything else, falling back to
# `index.html` so a future client-side router still works. Revisit
# this if/when the frontend grows real root-level routes of its own.

upstream natra_backend {
    # Uvicorn (see deploy/systemd/natra-backend.service), same VM, over
    # loopback — keep this as 127.0.0.1, not a public address; Nginx is
    # the only thing that should ever reach Uvicorn directly.
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with the real domain once one is pointed at this VM.
    server_name natra.example.com;

    access_log /var/log/nginx/natra.access.log;
    error_log  /var/log/nginx/natra.error.log;

    # JSON request bodies only, no file uploads accepted by any current
    # endpoint — generous but not unbounded.
    client_max_body_size 1m;

    # Built frontend, per SETUP.md's clone target (/opt/natra) plus
    # Vite's default build.outDir ("dist", unchanged in
    # frontend/vite.config.ts). Adjust if the repo is cloned elsewhere.
    root /opt/natra/frontend/dist;

    # Every current backend route (backend/app/main.py) starts with
    # one of these six prefixes — matched here as a real prefix, not
    # a whole-segment word boundary, so e.g. `/products` and
    # `/products/{id}` both hit this block via the single `products`
    # alternative, and `/payment-info` matches itself exactly.
    location ~ ^/(health|sellers/|products|payment-info|receipts/|admin/) {
        proxy_pass http://natra_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend's own login rate limiting (Task 44) keys off
        # request.client.host, which Uvicorn's --proxy-headers flag
        # (see deploy/systemd/natra-backend.service) rewrites from
        # X-Forwarded-For — but only for requests Uvicorn sees
        # originating at 127.0.0.1, i.e. from this Nginx. Sending a
        # single, non-appended value here (rather than the more usual
        # "append the real IP to any existing X-Forwarded-For", which
        # would let a malicious client forge earlier hops) is
        # deliberate: Nginx is the only hop between the browser and
        # Uvicorn, so $remote_addr here is always the true client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx forwards the Authorization header to the upstream by
        # default with proxy_pass (unlike some other proxy modules) —
        # this line is only here to make that explicit rather than
        # relying on the default silently continuing to work.
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # Generous: Task 26's receipt verification pipeline launches a
        # real headless browser (Playwright) to load a CBE/Telebirr
        # receipt page synchronously within the request — slower than a
        # typical JSON endpoint.
        proxy_read_timeout 30s;
    }

    # Everything else: the built frontend. try_files serves a real
    # static asset (JS/CSS bundle, favicon, etc.) when one exists at
    # that path, and falls back to index.html otherwise — the
    # standard SPA pattern, so a future client-side router (there is
    # none yet — see the routing-split comment above) still works
    # without a matching Nginx rule for every route it adds.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- TLS ---
    # Not configured yet — no domain/certificate exists for this VM at
    # the time this skeleton was written. Once a real domain points
    # here, the standard approach is:
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d natra.example.com
    # which rewrites this file in place to add a `listen 443 ssl`
    # server block (plus certificate paths) and a `server { listen 80;
    # return 301 https://...; }` redirect block — not hand-written here
    # ahead of having a real cert to configure it with.
}
